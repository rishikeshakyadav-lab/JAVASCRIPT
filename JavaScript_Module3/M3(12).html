<!--Print numbers from 10 to 1 using a while loop. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let i = 10;
        while (i >= 1) {
            console.log(i);
            i--;
        }
    </script>
</body>

</html>
