<!--Create an arrow function to find the square of a number. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let square = (num) => {
            return num * num;
        };
        console.log(square(7)); 
    </script>
</body>

</html>
