<!--Create a function that checks whether a number is even. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function even(num) {
            if (num % 2 == 0) {
                console.log("Even");
            }
            else {
                console.log("Odd");
            }
        }

        even(8); 
    </script>
</body>

</html>
