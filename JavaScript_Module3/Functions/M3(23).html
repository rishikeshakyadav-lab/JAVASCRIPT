<!--Create a function that returns the remainder of two numbers. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function remainder(a, b) {
            return a % b;
        }
        console.log(remainder(10, 3)); 
    </script>
</body>

</html>
