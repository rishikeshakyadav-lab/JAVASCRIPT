<!--Create a function that returns the greater of two numbers. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function greater(a, b) {
            if (a > b) {
                return a;
            }

            return b;
        }

        console.log(greater(15, 20)); 
    </script>
</body>

</html>
