<!--Create a function that prints all even numbers from 1 to 20.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function printEvenNumbers() {
            for (let i = 2; i <= 20; i += 2) {
                console.log(i);
            }
        }
        printEvenNumbers();

    </script>
</body>

</html>
