<!--Create a function that returns the smaller of two numbers.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function smaller(a, b) {
            if (a < b) {
                return a;
            }

            return b;
        }

        console.log(smaller(15, 20));
    </script>
</body>

</html>
