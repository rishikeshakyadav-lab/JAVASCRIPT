<!--Create a function that prints "Good Morning" three times.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function printGreeting() {
            for (let i = 0; i < 3; i++) {
                console.log("Good Morning");
            }
        }
        printGreeting();
    </script>
</body>

</html>
