<!--Create a function that finds the cube of a number.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function cube(num) {
            console.log(num * num * num);
        }
        cube(3);
    </script>
</body>

</html>
