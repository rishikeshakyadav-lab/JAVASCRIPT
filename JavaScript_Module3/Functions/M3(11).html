<!--Create a function that returns the product of two numbers.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function product(a, b) {
            return a * b;
        }
        console.log(product(10, 20));

    </script>
</body>

</html>
