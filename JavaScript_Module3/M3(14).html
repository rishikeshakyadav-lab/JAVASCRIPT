<!--Print all multiples of 3 from 1 to 30.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        for (let i = 3; i <= 30; i += 3) {
            console.log(i);
        } 
    </script>
</body>

</html>
