<!--Create a function that returns a function to calculate the 
area of a circle.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function circlearea() {
            return function (radius) {
                return 3.14 * radius * radius;
            };
        }
        let area = circlearea();
        console.log(area(5));
    </script>
</body>

</html>
