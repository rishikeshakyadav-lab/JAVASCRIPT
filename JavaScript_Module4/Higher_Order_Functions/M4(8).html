<!--Create a Higher Order Function to subtract two numbers.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function subtract(a, b) {
            console.log(a - b);
        }
        function operation(fun, x, y) {
            fun(x, y);
        }
        operation(subtract, 15, 10);
    </script>
</body>

</html>
