<!--Create a function "multiplyBy()" that returns another 
function.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function multiplyByx() {
            return function (n) {
                return n * 5;
            }
        }
        result = multiplyByx();
        console.log(result(10));
    </script>
</body>

</html>
