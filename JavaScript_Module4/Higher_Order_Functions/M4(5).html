<!--Pass a function that calculates the cube of a number.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function cube(n) {
            return n * n * n;
        }
        function execute(fun, n) {
            console.log(fun(n));
        }
        execute(cube, 3); 
    </script>
</body>           
</html>
