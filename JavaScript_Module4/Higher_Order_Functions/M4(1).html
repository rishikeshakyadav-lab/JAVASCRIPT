<!--Display a “welcome” message using a Higher Order 
Function.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function display() {
            console.log("Welcome to JavaScript");
        }
        function execute(fun) {
            fun();
        }
        execute(display);
    </script>
</body>

</html>
