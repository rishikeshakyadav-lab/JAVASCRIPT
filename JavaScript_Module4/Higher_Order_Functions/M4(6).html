<!--Create a function that accepts a function and prints its 
result.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function greet() {
            alert("Hello Students");
        }
        function execute(fun) {
            fun();
        }
        execute(greet);
    </script>
</body>

</html>
