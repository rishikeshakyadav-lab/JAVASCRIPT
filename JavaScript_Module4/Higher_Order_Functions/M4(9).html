<!--Create a Higher Order Function to check whether a 
number is even.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function isEven(n) {
            return n % 2 === 0;
        }
        function check(fun, n) {
            console.log(fun(n));
        }
        check(isEven, 10);
    </script>
</body>

</html>
