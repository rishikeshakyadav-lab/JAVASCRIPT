<!--Use a Higher Order Function to divide two numbers.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function divide(a, b) {
            return a / b;
        }
        function operation(fun, x, y) {
            return fun(x, y);
        }
        console.log(operation(divide, 15, 10));
    </script>
</body>

</html>
