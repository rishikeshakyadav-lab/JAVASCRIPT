<!--Display Welcome Message Using Higher Order Function-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function display() {
            alert("Welcome to JavaScript");
        }

        function executeFunction(func) {
            func();
        }
        execute(display);
    </script>
</body>

</html>
