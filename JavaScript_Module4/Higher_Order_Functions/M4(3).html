<!--Create a function "calculate()" that accepts another 
function and two numbers.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function add(a, b) {
            return a + b;
        }
        function calculate(fun, x, y) {
            console.log(fun(x, y));
        }
        calculate(add, 10, 20); 
    </script>
</body>

</html>
