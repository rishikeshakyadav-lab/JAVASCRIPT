<!--Create a Higher Order Function that displays "JavaScript 
is Easy"-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function message() {
            console.log("JavaScript is Easy");
        }
        function execute(fun) {
            fun();
        }
        execute(message);
    </script>
</body>

</html>
