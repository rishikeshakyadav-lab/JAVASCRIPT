<!--Create a function that returns a function to convert 
Celsius into Fahrenheit.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function convertToFarenhiet() {
            return function (celsius){
                return (celsius * 9/5) + 32;
            }
        }
        let result = convertToFarenhiet();
        console.log(result(30));
    </script>
</body>
</html>
