<!--Create a function that returns a function to check 
whether a number is even.-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function getEvenChecker() {

            return function (n) {
                return n % 2 === 0;
            };
        }

        let check = getEvenChecker();

        console.log(check(80));
    </script>
</body>

</html>
