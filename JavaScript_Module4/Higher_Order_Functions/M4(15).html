<!--Create a function that returns a function to calculate the 
cube.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function cube () {
            return function (n) {
                return n * n * n;
            }
        }
        let result = cube();
        console.log(result(3));
    </script>
</body>
</html>
