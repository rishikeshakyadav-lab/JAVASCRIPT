<!--Create a function "greeting()" that accepts a name and 
returns another function that displays the greeting.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function greeting(name) {
            return function () {
                console.log("Hello " + name);
            }
        }
        let greet = greeting("John");
        greet();
    </script>
</body>
</html>
