<!--Write a program to check whether today is a weekday or a holiday using the OR (||) operator -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let isWeekday = confirm("Is today a weekday?");
        let isHoliday = confirm("Is today a holiday?");
        alert(isWeekday || isHoliday);
    </script>
</body>
</html>
