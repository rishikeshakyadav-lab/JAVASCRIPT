<!--Take two numbers from the user and display the results of >, <, >=, and <= -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = Number(prompt("Enter First Number"));
        let num2 = Number(prompt("Enter Second Number"));
        alert("Greater Than : " + (num1 > num2));
        alert("Less Than : " + (num1 < num2));
        alert("Greater Than or Equal : " + (num1 >= num2));
        alert("Less Than or Equal : " + (num1 <= num2));
    </script>
</body>
</html>
