<!--Take a number from the user and check whether it is greater than 10 and less than 50.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = Number(prompt("Enter a number"));
        alert(number > 10 && number < 50);
    </script>
</body>
</html>
