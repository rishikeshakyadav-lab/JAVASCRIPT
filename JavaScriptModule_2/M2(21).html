<!--Create a boolean variable isLoggedIn. Use the NOT (!) operator to display the opposite value.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let isLoggedIn = confirm("Are you logged in?");
        alert(!isLoggedIn);
    </script>
</body>
</html>
