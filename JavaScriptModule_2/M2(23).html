<!--Write a program to check whether a student has passed if marks are greater than or equal to 35 AND attendance is greater than or equal to 75%-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let marks = Number(prompt("Enter your marks"));
        let attendance = Number(prompt("Enter your attendance percentage"));
        alert(marks >= 35 && attendance >= 75);
    </script>
</body>
</html>
