<!--Write a program to check whether a person iseligible to vote using the AND (&&) operator.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age = Number(prompt("Enter your age"));
        let isCitizen = confirm("Are you a citizen?");
        alert(age >= 18 && isCitizen);
    </script>
</body>
</html>
