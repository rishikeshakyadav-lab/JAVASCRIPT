<!--Write a Javascript program to compare two numbers and display whether the first number is greater than the second without function button and if else-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = Number(prompt("Enter first number"))
        let num2 = Number(prompt("Enter second number"))
        
        alert(num1>num2)
    </script>
</body>
</html>
