<!--Write a JavaScript program to check whether a
number is less than 100-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = Number(prompt("Enter a Number"));
        alert(number < 100);
    </script>
</body>
</html>
