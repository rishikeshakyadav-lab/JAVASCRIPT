<!--Write a program to check whether a person is eligible to vote using the ternary operator.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age = Number(prompt("Enter Age"));
        let result = (age >= 18) ? "Eligible to Vote" : "Not Eligible to Vote";
        alert(result);
    </script>
</body>
</html>
