<!--Compare two strings entered by the user using the strict equality (===) operator-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str1 = prompt("Enter First String");
        let str2 = prompt("Enter Second String");

        alert(str1 === str2);
    </script>
</body>
</html>
