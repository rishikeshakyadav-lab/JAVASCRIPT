<!--Write a program to display "Eligible for Discount" if the purchase amount is ₹1000 or more; otherwise display "No Discount" using the ternary operator.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let purchaseAmount = Number(prompt("Enter Purchase Amount"));
        let result = (purchaseAmount >= 1000) ? "Eligible for Discount" : "No Discount";
        alert(result);
    </script>
</body>
</html>
