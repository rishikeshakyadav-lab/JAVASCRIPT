<!--Write a program to check whether a number is positive or negative using the ternary operator.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = Number(prompt("Enter a Number"));
        let result = (number >= 0) ? "Positive Number" : "Negative Number";
        alert(result);
    </script>
</body>
</html>
