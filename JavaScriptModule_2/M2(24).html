<!--Write a program to check whether a student has passed or failed using the ternary operator.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let marks = Number(prompt("Enter your marks"));
        let result = marks >= 35 ? "Passed" : "Failed";
        alert(result);
    </script>
</body>
</html>
